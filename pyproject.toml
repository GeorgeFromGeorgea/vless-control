[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vless-control"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot==22.5"]

[project.scripts]
vless-control-bot = "vless_control.bot:main"

[tool.setuptools.packages.find]
include = ["vless_control*"]
